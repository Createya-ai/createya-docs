name: Build & deploy docs.createya.ai

# Триггеры:
#   - Push в main → деплой
#   - Cron каждый понедельник 09:00 UTC → пересобирает каталог моделей и деплоит
#   - workflow_dispatch → ручной запуск (например после изменения цен)

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Зачем триггерим'
        required: false
        default: 'manual rebuild'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-docs
      cancel-in-progress: false

    env:
      # Актуальный PROD-хост (всё-в-одном: Supabase + фронт + docs).
      # При переезде менять ЗДЕСЬ, в одном месте.
      PROD_HOST: 80.66.81.59

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync models from /v1/models
        env:
          CREATEYA_API_KEY: ${{ secrets.CREATEYA_API_KEY }}
        run: npm run sync:models || echo "Sync skipped (api closed)"
        continue-on-error: true

      - name: Commit updated model pages (if changed)
        run: |
          git config user.name "createya-docs-bot"
          git config user.email "support@createya.ai"
          if git diff --quiet models/; then
            echo "No model changes."
          else
            git add models/
            git commit -m "chore(sync): обновлён каталог моделей $(date +%Y-%m-%d)"
            git push origin HEAD
          fi
        continue-on-error: true

      - name: Build VitePress site
        run: npm run build

      - name: Setup SSH for rsync
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY_PROD_VM }}

      - name: Add VM to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$PROD_HOST" >> ~/.ssh/known_hosts

      # CRE 2026-09-19: было 158.160.180.43 — фронтовая VM, выведенная из
      # эксплуатации при переезде PROD. Каждый деплой с тех пор уезжал в никуда,
      # /var/www/docs.createya.ai на живом хосте оставался пустым, сайт отдавал
      # 404, а серт docs.createya.ai не мог продлиться (webroot отсутствовал) и
      # протух 2026-07-28. Workflow при этом был зелёным — см. Verify ниже.
      - name: Rsync built site to PROD VM
        run: |
          rsync -avz --delete \
            --exclude '.well-known' \
            ./.vitepress/dist/ \
            "createya@$PROD_HOST:/var/www/docs.createya.ai/"

      # --exclude '.well-known' обязателен: там лежит webroot ACME-челленджа
      # (certbot пишет в /var/www/docs.createya.ai/.well-known/acme-challenge),
      # и --delete без исключения снёс бы его вместе с продлением серта.

      # CRE 2026-09-19: раньше здесь был `curl -sI | head -3` без проверки кода
      # ответа — шаг проходил всегда, даже когда сайт отдавал 404 с пустого
      # каталога. Теперь падаем, если главная не 200.
      - name: Verify deploy
        run: |
          sleep 3
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://docs.createya.ai/)
          echo "GET https://docs.createya.ai/ -> $code"
          if [ "$code" != "200" ]; then
            echo "::error::docs.createya.ai отдаёт $code вместо 200 — деплой не доехал"
            exit 1
          fi
          # Серт тоже проверяем: истёкший серт ломает сайт так же надёжно.
          curl -sS -o /dev/null --max-time 20 https://docs.createya.ai/ \
            || { echo "::error::TLS-проверка не прошла (возможно, просрочен сертификат)"; exit 1; }
          echo "✓ Deploy complete: https://docs.createya.ai/"
